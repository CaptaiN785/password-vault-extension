<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embedded login</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 4px; color: #0f172a; }
    label { display: block; font-size: 12px; color: #64748b; margin: 8px 0 3px; }
    input { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1;
            border-radius: 6px; font: inherit; box-sizing: border-box; }
    button { margin-top: 12px; padding: 7px 13px; border-radius: 6px;
             border: 1px solid #2563eb; background: #2563eb; color: #fff;
             font: inherit; cursor: pointer; }
    .state { margin-top: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace;
             background: #f1f5f9; border-radius: 6px; padding: 7px 9px; white-space: pre-wrap; }
  </style>
</head>
<body>
<form id="f" onsubmit="return false">
  <label for="u">Email</label>
  <input id="u" name="email" type="email" autocomplete="username">
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
<div class="state" id="s">value: (empty)</div>
<script>
  const s = document.getElementById('s');
  document.getElementById('f').addEventListener('input', () => {
    const u = document.getElementById('u').value;
    const p = document.getElementById('p').value;
    s.textContent = `email: ${u || '(empty)'}\npassword: ${'•'.repeat(p.length) || '(empty)'}`;
  });
</script>
</body>
</html>
