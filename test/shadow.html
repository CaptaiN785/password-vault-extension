<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture 3 — open shadow root</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 32px; background: #f8fafc; color: #0f172a; }
    a { color: #2563eb; }
    .back { display: inline-block; margin-bottom: 20px; font-size: 13px; }
    h1 { font-size: 19px; margin: 0 0 6px; }
    .note { color: #64748b; max-width: 62ch; margin: 0 0 22px; }
    fieldset { border: 1px solid #e2e8f0; border-radius: 10px; background: #fff;
               padding: 16px 18px; max-width: 380px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: block; font-size: 12px; color: #64748b; margin: 10px 0 3px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            font: inherit; box-sizing: border-box; }
    button { margin-top: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid #2563eb;
             background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    .state { margin-top: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace;
             background: #f1f5f9; border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; }
    .proves { border-left: 3px solid #2563eb; padding: 2px 0 2px 12px; margin: 0 0 22px;
              color: #475569; max-width: 62ch; }
</style>
</head>
<body>
<a class="back" href="login.html">&larr; All fixtures</a>
<h1>Fixture 3 — open shadow root</h1>
<p class="proves">The inputs live inside a web component&rsquo;s shadow tree, so a plain <code>document.querySelectorAll</code> cannot see them. Detection has to walk open shadow roots.</p>
<login-form></login-form>
<div class="state" id="state">username: (empty)
password: (empty)</div>
<script>
  class LoginForm extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          fieldset { border: 1px solid #e2e8f0; border-radius: 10px; background: #fff;
                     padding: 16px 18px; max-width: 380px;
                     font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
          legend { font-weight: 600; padding: 0 6px; }
          label { display: block; font-size: 12px; color: #64748b; margin: 10px 0 3px; }
          input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1;
                  border-radius: 6px; font: inherit; box-sizing: border-box; }
          button { margin-top: 14px; padding: 8px 14px; border-radius: 6px;
                   border: 1px solid #2563eb; background: #2563eb; color: #fff;
                   font: inherit; cursor: pointer; }
        </style>
        <fieldset>
          <legend>Sign in</legend>
          <form>
            <label>Account</label>
            <input name="username" type="text" autocomplete="username">
            <label>Password</label>
            <input name="password" type="password">
            <button type="submit">Sign in</button>
          </form>
        </fieldset>`;
      const state = document.getElementById('state');
      root.addEventListener('input', () => {
        const u = root.querySelector('input[name=username]').value;
        const p = root.querySelector('input[name=password]').value;
        state.textContent = `username: ${u || '(empty)'}\npassword: ${'\u2022'.repeat(p.length) || '(empty)'}`;
      });
      root.querySelector('form').addEventListener('submit', (e) => e.preventDefault());
    }
  }
  customElements.define('login-form', LoginForm);
</script>
</body>
</html>
