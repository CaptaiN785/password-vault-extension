<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture 2 — React-style tracked inputs</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 32px; background: #f8fafc; color: #0f172a; }
    a { color: #2563eb; }
    .back { display: inline-block; margin-bottom: 20px; font-size: 13px; }
    h1 { font-size: 19px; margin: 0 0 6px; }
    .note { color: #64748b; max-width: 62ch; margin: 0 0 22px; }
    fieldset { border: 1px solid #e2e8f0; border-radius: 10px; background: #fff;
               padding: 16px 18px; max-width: 380px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: block; font-size: 12px; color: #64748b; margin: 10px 0 3px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            font: inherit; box-sizing: border-box; }
    button { margin-top: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid #2563eb;
             background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    .state { margin-top: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace;
             background: #f1f5f9; border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; }
    .proves { border-left: 3px solid #2563eb; padding: 2px 0 2px 12px; margin: 0 0 22px;
              color: #475569; max-width: 62ch; }
</style>
</head>
<body>
<a class="back" href="login.html">&larr; All fixtures</a>
<h1>Fixture 2 — React-style tracked inputs</h1>
<p class="proves">Reproduces React&rsquo;s input value tracker. A naive <code>el.value = x</code> is swallowed here, so the model below only updates if the fill went through the prototype&rsquo;s native setter. Watch the model, not the input box.</p>
<fieldset>
  <legend>Log in</legend>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username">
    <label for="p">Password</label>
    <input id="p" name="password" type="password">
    <button type="button" id="submit">Log in</button>
  </form>
  <div class="state" id="state">model: {}</div>
</fieldset>
<script>
  // Mirrors React's tracker: assigning through the instance property updates the tracked
  // value too, so React concludes nothing changed and drops the event. Only a write via
  // HTMLInputElement.prototype's setter leaves the tracker stale and registers as input.
  const model = {};
  const state = document.getElementById('state');

  function attachTracker(node) {
    const desc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(node), 'value');
    let tracked = String(node.value);
    Object.defineProperty(node, 'value', {
      configurable: true,
      get() { return desc.get.call(this); },
      set(v) { tracked = String(v); desc.set.call(this, v); },
    });
    node._tracker = { get: () => tracked, set: (v) => { tracked = String(v); } };
  }

  for (const id of ['u', 'p']) {
    const el = document.getElementById(id);
    attachTracker(el);
    el.addEventListener('input', () => {
      const next = el.value;
      if (el._tracker.get() === next) return;   // React would ignore this event
      el._tracker.set(next);
      model[el.name] = el.type === 'password' ? '\u2022'.repeat(next.length) : next;
      state.textContent = 'model: ' + JSON.stringify(model, null, 1);
    });
  }
</script>
</body>
</html>
