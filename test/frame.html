  <style>

<body>
<a class="back" href="login.html">&larr; All fixtures</a>
<h1>Fixture 4 — login inside an iframe</h1>
<p class="proves">The form is in a child frame. The worker has to enumerate frames, find the one holding the password field, and send both the picker and the fill there &mdash; not to the top document.</p>
<iframe src="iframe-login.html" title="Embedded login"
        style="width:420px;height:300px;border:1px solid #e2e8f0;border-radius:10px;background:#fff"></iframe>
